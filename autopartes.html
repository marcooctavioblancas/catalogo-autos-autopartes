<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autopartes usadas — IGRIS</title>
  <meta name="description" content="Vehículos para desarme: elige el auto y consulta qué piezas están en existencia.">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body data-pagina="autopartes">

  <main>
    <section class="encabezado">
      <div class="contenedor">
        <nav class="cambio" aria-label="Sección">
          <a href="seminuevos.html">Seminuevos</a>
          <a href="autopartes.html" class="activo" aria-current="page">Autopartes</a>
        </nav>
        <h1>Autopartes usadas</h1>
        <p>Elige el vehículo y revisa pieza por pieza qué hay en existencia.</p>
      </div>
    </section>

    <div class="contenedor">
      <form class="filtro filtro--partes" id="filtro" autocomplete="off">
        <label class="campo campo--ancho">Buscar pieza o vehículo
          <input type="search" name="buscar" placeholder="Ej. alternador, faro, Aveo">
        </label>
        <label class="campo">Marca
          <select name="marca"></select>
        </label>
        <label class="campo">Modelo
          <select name="modelo"></select>
        </label>
        <label class="campo">Año
          <select name="anio"></select>
        </label>
        <label class="casilla">
          <input type="checkbox" name="existencia"> Solo con piezas en existencia
        </label>
        <button class="boton boton--linea" type="reset">Limpiar</button>
      </form>

      <section class="seccion seccion--lista">
        <div class="seccion__cabeza">
          <h2>Últimos autos agregados <small id="conteo"></small></h2>
        </div>
        <div class="rejilla" id="resultados"></div>
      </section>
    </div>
  </main>

  <script src="api/datos.php"></script>
  <script src="js/app.js"></script>
</body>
</html>
